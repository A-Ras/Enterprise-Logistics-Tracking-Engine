name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Neu auf v5 aktualisiert (behebt die Warnung)
      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Behebt Exit Code 126: Gibt Linux die Rechte, mvnw auszuführen!
      - name: Maven Wrapper ausführbar machen
        run: chmod +x ./mvnw

      - name: Tests ausführen (Unit- & Testcontainers-Integrationstests)
        run: ./mvnw clean verify -B

      - name: Docker Image bauen (Build-Prüfung)
        run: docker build -t logitrack/tracking-service:latest .